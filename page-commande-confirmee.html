<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commande confirmée — Maison Ambre</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..500&display=swap">
  <link rel="stylesheet" href="styles-base-entete.css">

  <style>
    /* Page affichée après un paiement réussi : bloc centré qui apparaît en douceur */
    .confirmation {
      min-height: 100vh; min-height: 100svh;
      display: grid; place-items: center;
      padding: 47px var(--marge);
      text-align: center;
    }
    .confirmation__contenu { display: grid; justify-items: center; gap: 18px; max-width: 560px; animation: apparaitre 1.1s var(--courbe) both; }
    .confirmation .marque { justify-self: center; }
    .confirmation .marque .icone { width: 36px; height: 36px; }
    .confirmation__coche {
      display: grid; place-items: center;
      width: 72px; height: 72px; border-radius: 50%;
      border: 1px solid var(--filet-fort);
      animation: apparaitre 1.1s var(--courbe) 0.2s both;
    }
    .confirmation__coche svg { width: 30px; height: 30px; }
    .confirmation__coche path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: tracer 0.8s var(--courbe) 0.6s forwards; }
    .confirmation__texte { color: var(--fumee); }
    .confirmation__contact a { color: var(--blanc); text-decoration: underline; text-underline-offset: 3px; }
    .confirmation .pilule { margin-top: 12px; }
    @keyframes apparaitre { from { opacity: 0; translate: 0 30px; } to { opacity: 1; translate: 0 0; } }
    @keyframes tracer { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .confirmation__coche path { stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="icone-marque" viewBox="0 0 32 32"><path d="M6 29V15a10 10 0 0 1 20 0v14M16 29V19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  </svg>

  <main class="confirmation">
    <div class="confirmation__contenu">
      <a href="index.html" class="marque" aria-label="Maison Ambre, retour à l'accueil">
        <svg class="icone"><use href="#icone-marque"/></svg>
      </a>
      <span class="confirmation__coche" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <p class="bloc-titre__label">Merci pour votre confiance</p>
      <h1 class="bloc-titre__mot">Commande confirmée</h1>
      <p class="confirmation__texte">Votre paiement a bien été reçu et votre commande est en préparation. Elle sera expédiée sous 48 h.</p>
      <p class="note confirmation__contact">
        Une question ? <a href="mailto:maisonambre@gmail.com">maisonambre@gmail.com</a> · <a href="tel:+33662488337">06 62 48 83 37</a>
      </p>
      <a href="index.html" class="pilule">
        <span class="roulant"><span data-texte="Retour à la boutique">Retour à la boutique</span></span>
      </a>
    </div>
  </main>

  <script>
    // La commande est payée : on vide le panier gardé dans le navigateur
    try { localStorage.removeItem('maison-ambre-panier'); } catch (e) {}
  </script>
</body>
</html>
