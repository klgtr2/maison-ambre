<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produit — Maison Ambre</title>
  <meta name="description" content="Encens, bougies et parfums d'ambiance Maison Ambre.">
  <meta name="theme-color" content="#F7F2EA">
  <script>
    document.documentElement.classList.add('avec-js');
    setTimeout(function () { if (!window.BOUTIQUE) document.documentElement.classList.remove('avec-js'); }, 4000);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Manrope:wght@400..700&display=swap">
  <link rel="stylesheet" href="styles-base.css">
  <link rel="stylesheet" href="styles-boutique.css">
  <link rel="stylesheet" href="styles-panier-cookies.css">
  <script src="configuration-boutique.js" defer></script>
  <script src="catalogue-produits.js" defer></script>
  <script src="script-commun.js" defer></script>
  <script src="script-panier.js" defer></script>
  <script src="script-produit.js" defer></script>
</head>
<body data-page="produit">
  <div data-entete style="min-height: 99px"></div>

  <main id="contenu" class="conteneur">
    <nav class="fil-ariane" aria-label="Fil d'Ariane" data-fil>
      <a href="index.html">Accueil</a><span aria-hidden="true">/</span><span>Produit</span>
    </nav>

    <!-- Fiche produit (remplie par script-produit.js à partir du catalogue) -->
    <div class="fiche">
      <div class="galerie" data-galerie></div>
      <div class="fiche__infos" data-infos></div>
    </div>

    <!-- « À associer avec » -->
    <section class="section" data-duo hidden></section>

    <!-- Produits similaires -->
    <section class="section">
      <div class="entete-section" data-apparition>
        <p class="surtitre">Vous aimerez aussi</p>
        <h2 class="titre-2">Dans le même esprit</h2>
      </div>
      <div class="grille-produits grille-produits--4" data-similaires></div>
    </section>
  </main>

  <!-- Barre d'achat toujours visible en bas de l'écran sur mobile -->
  <div class="barre-achat" data-barre-achat aria-hidden="true"></div>

  <div data-pied></div>
</body>
</html>
