<svg xmlns="http://www.w3.org/2000/svg" viewBox="130 88 140 250" role="img" aria-label="Bougie parfumée Ambre et Vanille dans un pot en verre">
  <style>
    .flamme{transform-box:fill-box;transform-origin:50% 100%;animation:vacille 1.4s ease-in-out infinite}
    @keyframes vacille{50%{transform:scale(.86,1.14) rotate(3deg)}}
    @media (prefers-reduced-motion:reduce){.flamme{animation:none}}
  </style>
  <!-- Pot en verre dépoli et cire -->
  <rect x="140" y="150" width="120" height="180" rx="22" fill="#e9dcc8"/>
  <rect x="150" y="176" width="100" height="144" rx="16" fill="#f7efe3"/>
  <ellipse cx="200" cy="178" rx="50" ry="8" fill="#efe2cf"/>
  <!-- Étiquette -->
  <rect x="158" y="232" width="84" height="56" rx="6" fill="#2b211b"/>
  <path d="M172 252h56M180 266h40" stroke="#d9a15b" stroke-width="3" stroke-linecap="round"/>
  <!-- Mèche et flamme animée -->
  <path d="M200 176v-18" stroke="#5a4a3f" stroke-width="3" stroke-linecap="round"/>
  <path class="flamme" d="M200 158c-12-12-8-30 0-44 8 14 12 32 0 44z" fill="#f2a33a"/>
  <path class="flamme" d="M200 156c-6-7-4-16 0-24 4 8 6 17 0 24z" fill="#fde7b0"/>
  <!-- Reflet du verre -->
  <path d="M152 170v140" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".5"/>
</svg>
