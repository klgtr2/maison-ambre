<svg xmlns="http://www.w3.org/2000/svg" viewBox="56 68 288 272" role="img" aria-label="Enfilade Lune en noyer et cannage">
  <style>
    .flamme{transform-box:fill-box;transform-origin:50% 100%;animation:vacille 1.6s ease-in-out infinite}
    @keyframes vacille{50%{transform:scale(.85,1.12)}}
    @media (prefers-reduced-motion:reduce){.flamme{animation:none}}
  </style>
  <defs>
    <pattern id="cannage" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M0 0l9 9M9 0L0 9" stroke="#a66a3f" stroke-width="1.3"/>
    </pattern>
  </defs>
  <!-- Pieds et corps en noyer -->
  <path d="M96 300l-8 32M304 300l8 32" stroke="#8a5530" stroke-width="9" stroke-linecap="round"/>
  <rect x="70" y="202" width="260" height="102" rx="10" fill="#a66a3f"/>
  <rect x="64" y="194" width="272" height="14" rx="7" fill="#8a5530"/>
  <!-- Portes (celle du centre en cannage) -->
  <rect x="82" y="216" width="76" height="76" rx="6" fill="#b97c4e"/>
  <rect x="162" y="216" width="76" height="76" rx="6" fill="#e3c9a0"/>
  <rect x="162" y="216" width="76" height="76" rx="6" fill="url(#cannage)"/>
  <rect x="242" y="216" width="76" height="76" rx="6" fill="#b97c4e"/>
  <path d="M150 248v12M230 248v12M250 248v12" stroke="#5c3920" stroke-width="4" stroke-linecap="round"/>
  <!-- Vase et branchages -->
  <path d="M130 140c-18 14-22 40-4 54h28c18-14 14-40-4-54z" fill="#e9dcc8"/>
  <path d="M140 142c-4-22-14-38-30-50M140 142c2-26 10-44 24-58" stroke="#7a8a6a" stroke-width="3" stroke-linecap="round" fill="none"/>
  <g fill="#8c9a7e">
    <ellipse cx="108" cy="92" rx="10" ry="5" transform="rotate(-30 108 92)"/>
    <ellipse cx="122" cy="110" rx="10" ry="5" transform="rotate(20 122 110)"/>
    <ellipse cx="164" cy="84" rx="10" ry="5" transform="rotate(30 164 84)"/>
    <ellipse cx="153" cy="105" rx="10" ry="5" transform="rotate(-20 153 105)"/>
  </g>
  <!-- Livres et bougie -->
  <rect x="238" y="182" width="78" height="12" rx="2" fill="#6f7f6a"/>
  <rect x="244" y="170" width="66" height="12" rx="2" fill="#c0683f"/>
  <rect x="250" y="158" width="56" height="12" rx="2" fill="#d9a15b"/>
  <rect x="268" y="136" width="20" height="22" rx="4" fill="#f4eee6"/>
  <path class="flamme" d="M278 136c-5-6-2-12 0-16 2 4 5 10 0 16z" fill="#f2a33a"/>
  <!-- Ombre sous le plateau -->
  <path d="M70 212h260" stroke="#000" stroke-width="6" opacity=".18"/>
</svg>
