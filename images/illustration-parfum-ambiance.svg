<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 16 200 334" role="img" aria-label="Diffuseur de parfum d'ambiance Figue et Cèdre">
  <style>
    .onde{fill:none;stroke:#a3b096;stroke-width:3;stroke-linecap:round;opacity:0;animation:monter 4.5s ease-in-out infinite}
    .o2{animation-delay:1.5s}.o3{animation-delay:3s}
    @keyframes monter{0%{opacity:0;transform:translateY(24px)}35%{opacity:.9}100%{opacity:0;transform:translateY(-26px)}}
    @media (prefers-reduced-motion:reduce){.onde{animation:none;opacity:.6}}
  </style>
  <!-- Bâtonnets en rotin -->
  <path d="M200 214L146 68M200 214L172 56M200 214l2-162M200 214l28-152M200 214l54-140" stroke="#a87543" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Ondes parfumées animées -->
  <path class="onde" d="M130 128c-8-8 8-14 0-24s8-16 0-24"/>
  <path class="onde o2" d="M272 120c-8-8 8-14 0-24s8-16 0-24"/>
  <path class="onde o3" d="M240 100c-8-8 8-14 0-24s8-16 0-24"/>
  <!-- Flacon en verre ambré -->
  <rect x="184" y="204" width="32" height="30" rx="6" fill="#b8955f"/>
  <rect x="146" y="228" width="108" height="116" rx="30" fill="#d39a55"/>
  <rect x="154" y="262" width="92" height="74" rx="24" fill="#b5642f" opacity=".5"/>
  <rect x="170" y="276" width="60" height="34" rx="5" fill="#f4eee6"/>
  <path d="M182 288h36M188 298h24" stroke="#5a4a3f" stroke-width="3" stroke-linecap="round"/>
  <!-- Reflet du verre -->
  <path d="M162 250c-6 20-6 50 2 74" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".4" fill="none"/>
</svg>
