# =========================================================
# MAISON AMBRE — Réglages de l'hébergement Netlify
# Le site est servi tel quel (aucune étape de construction) et la
# fonction de paiement Stripe se trouve dans netlify/functions.
# =========================================================
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# En-têtes de sécurité de base
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
